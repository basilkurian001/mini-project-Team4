<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048</title>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x1096.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone 5+ -->
  <link rel="apple-touch-startup-image" href="meta/apple-touch-startup-image-640x920.png"  media="(device-width: 320px) and (device-height: 480px) and (-webkit-device-pixel-ratio: 2)"> <!-- iPhone, retina -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">

  <script src="../../backend/authenticationChecker.js"></script>
  <script src="../../backend/scoreHandler.js"></script>
  
</head>
<body>
  <div id="leaderboard">
    <h3 id="leaderboardheading">🏆 TOP SCORERS</h3>
    <div>
        <ol id="leaderboardlist">
        </ol>
    </div>
  </div>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div id="score-container" class="score-container">0</div>
        <div class="highScoreDiv">
          <div style="font-size: 15px;">HIGH SCORE</div>
          <div id="highScoreText"></div>
        </div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <a class="restart-button">New Game</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
	        <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <p class="game-explanation">
      <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
    </p>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
  <script>
    let score = 0;
      async function checkAuth() {
          const loggedIn = await checkAuthStatus();
          if (loggedIn.isLoggedIn) {
              console.log("User logged in");
              // You can do post-game actions here, e.g., submit score
              score = document.getElementById("score-container").textContent;
              uploadScore(gameName="2048",score);
              setHighScore();
          } else {
              console.log("User not logged in");
              // Optional redirect
              // window.location.href = '/login.html';
          }
      }
      loadLeaderboard("2048");
      // Refresh leaderboard every 10 seconds
      async function setHighScore() {
        const playerHighscore = await fetchPlayerHighscore("2048");
        const highScoreText = document.getElementById("highScoreText");
        highScoreText.textContent = playerHighscore;
      }
      setInterval(() => {
          const leaderboardList = document.getElementById("leaderboardlist");
          leaderboardList.innerHTML = ""; // clear old entries
          loadLeaderboard("2048");
      }, 15000);
      window.onload = function(){
        setHighScore();
      }
   </script>
</body>
</html>
