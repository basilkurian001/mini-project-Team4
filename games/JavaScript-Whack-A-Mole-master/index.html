<!doctype html>

<head>
    <title>Whack-A-Mole</title>

    <script src="/mini-project-Team4-master/backend/authenticationChecker.js"></script>

    <script>
            async function checkAuth(count) {
                const loggedIn = await checkAuthStatus();
                if (loggedIn.isLoggedIn) {
                    console.log("User logged in");
                    // You can do post-game actions here, e.g., submit score
                    uploadScore(gameName="whack_a_mole",count);
                    const playerHighscore = await fetchPlayerHighscore("whack_a_mole");

                    //highscore text
                    const highScoreText = document.createElement("div");
                    highScoreText.id = "highScoreText";
                    highScoreText.textContent = "Your high score: ";
                    highScoreText.style.position = "absolute";
                    highScoreText.style.left = "50%";
                    // 50% + 40px moves it below the first one
                    highScoreText.style.top = "calc(50% + 60px)";
                    highScoreText.style.transform = "translate(-50%, -50%)";
                    highScoreText.style.color = "white";
                    highScoreText.style.fontSize = "40px";
                    highScoreText.style.fontWeight = "bold";
                    highScoreText.style.zIndex = "9999";
                    document.body.appendChild(highScoreText);

                    //const highScoreText = document.getElementById("highScoreText");
                    highScoreText.textContent += playerHighscore;
                } else {
                    console.log("User not logged in");
                    // Optional redirect
                    // window.location.href = '/login.html';
                }
            }
            loadLeaderboard("whack_a_mole");
            // Refresh leaderboard every 10 seconds
            setInterval(() => {
                const leaderboardList = document.getElementById("leaderboardlist");
                leaderboardList.innerHTML = ""; // clear old entries
                loadLeaderboard("whack_a_mole");
            }, 15000);
    </script>
</head>
