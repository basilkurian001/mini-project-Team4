    </style>

        <!-- <script src="/js/authenticationChecker.js"></script> -->
        <!-- <script src="/js/scoreHandler.js"></script> -->

        <script>
            const LEADERBOARD_API_URL = 'http://10.57.207.31/gamehub/backend/score_handler.php';
            async function loadLeaderboard(gameName) {
                try{
                    const response = await fetch(LEADERBOARD_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: new URLSearchParams({
                            action: "fetch_leaderboard",
                            gameName: gameName
                        }),
                    });
                    const result = await response.json();
                    //const text = await response.text();
                    //console.log("Raw response:", text);

                    //console.log(result.data.username+" "+result.data.gameName);

                    if(result.status=="success"){
                        const leaderboardList = document.getElementById("leaderboardlist");
                        result.data.forEach(player => {
                        const li = document.createElement("li");
                        li.textContent = `${player.user_name} - ${player[gameName]}`;
                        leaderboardList.appendChild(li);
                        });
                    }
                    else{
                        console.log(result.error);
                    }
                }catch(err){
                    console.log("Leaderboard fetch error: "+err);
                }
            }
            loadLeaderboard("click_shot");
            setInterval(() => {
                const leaderboardList = document.getElementById("leaderboardlist");
                leaderboardList.innerHTML = ""; // clear old entries
                loadLeaderboard("click_shot");
            }, 15000);

            const FETCH_PLAYER_HIGHSCORE_API_URL = '/api/fetchPlayerHighScore';
            async function fetchPlayerHighScore(gameName){
              try{
                  const response = await fetch(FETCH_PLAYER_HIGHSCORE_API_URL, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ gameName }),
                  });
                  result = await response.json();
                  if(result.status === "success"){
                    console.log("playerhighscore:"+result.player_highscore);
                    return result.player_highscore;
                  }else {
                      console.log("Failed to fetch player highscore: " + (result.error || 'Unknown error'));
                    }
              }catch(err){
                console.log("Failed to retrive high score from server: "+err);
              }
            }

            const CHECK_AUTH_API_URL = '/api/checkAuth';
            async function checkAuth(deadPlayerScore,init=0) {
              let result
                try {
                    const response = await fetch(CHECK_AUTH_API_URL, {
                        method: 'GET',
                        credentials: 'include' // browser cookies for Node session
                    });
                    result = await response.json();
                    if(result.authenticated){
                      if(init==1){
                        if(!result.authenticated){return false;}
                        window.userName = result.user.username;
                        return true;
                      }
                      console.log("user logged in")
                      await uploadScore("click_shot",deadPlayerScore);
                      const playerHighScore = await fetchPlayerHighScore("click_shot");
                      displayPlayerHighScore(playerHighScore);
                    }
                    else{
                      console.log("User not logged in")
                      return false;
                    }
                    return result.authenticated ? { isLoggedIn: true, user: result.user } : { isLoggedIn: false, user: null };
                } catch (error) {
                    console.error('Auth check failed:', error);
                    return { isLoggedIn: false, user: null, error: error.message };
                }
            }

            const UPLOAD_HIGHSCORE_API_URL = '/api/uploadScore';
            async function uploadScore(gameName="click_shot",deadPlayerScore) {
              let result
                try {
                  console.log("score: "+deadPlayerScore)
                    const response = await fetch(UPLOAD_HIGHSCORE_API_URL,{
                        method: 'POST',
                        credentials: 'include', // browser cookies for Node session
                         headers: {
                              'Content-Type': 'application/json'
                          },
                        body: JSON.stringify({ gameName, score:deadPlayerScore }) // send data in body
                    });
                    result = await response.json();
                    if (result.success){
                        console.log(result.message);
                    } else{
                        console.log(result.error);
                    }
                } catch (error) {
                    console.log("Failed to send score to server: "+error);
                }
            }

            function displayPlayerHighScore(playerHighScore){
              const playerHighScoreDiv = document.getElementById("playerHighScoreDIV");
              const playerHighScoreValue = document.getElementById("playerHighScoreValue");
              playerHighScoreValue.textContent = playerHighScore;
              playerHighScoreDiv.style.visibility = "visible";
            }
            let isAuthenticatedVar = null;
            async function initialise(reload = 0) {
                const userNameInputHTML = document.getElementById("usernameInput");
                const isAuthenticated = await checkAuth(0, 1);
                if (isAuthenticated) {
                  // ✅ User is logged in
                  if (isAuthenticatedVar === 0 && reload === 1) {
                    // was previously logged out but now logged in — reload to refresh session-based UI
                    location.reload();
                    return;
                  }

                  isAuthenticatedVar = 1;
                  const playerHighScore = await fetchPlayerHighScore("click_shot");
                  displayPlayerHighScore(playerHighScore);
                  userNameInputHTML.value = window.userName;
                  userNameInputHTML.style.visibility = "hidden";
                } else {
                  // ❌ User is not logged in
                  if (isAuthenticatedVar === 1 && reload === 1) {
                    // was logged in before, now logged out — reload the page
                    location.reload();
                    return;
                  }
                  isAuthenticatedVar = 0;
                  userNameInputHTML.style.visibility = "visible";
                  document.getElementById("playerHighScoreDIV").style.visibility = "hidden";
                }
            }
            window.onload = initialise;
        </script>
  </head>
